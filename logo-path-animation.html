<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zuris — Logo Path Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-brand: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --transition-theme: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                          color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                          border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                          box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      --duration: 3.2s;
    }

    [data-theme="dark"] {
      --bg-primary: #09090b;
      --surface-glass: rgba(255, 255, 255, 0.03);
      --surface-border: rgba(255, 255, 255, 0.08);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --ambient-glow: rgba(255, 255, 255, 0.15);
      --shadow-ambient: 0 28px 56px -12px rgba(0, 0, 0, 0.65), 0 1px 0 rgba(255, 255, 255, 0.08) inset;
      --bg-gradient: radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.04) 0%, transparent 65%);
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --surface-glass: rgba(255, 255, 255, 0.85);
      --surface-border: rgba(0, 0, 0, 0.08);
      --surface-hover: rgba(0, 0, 0, 0.05);
      --text-primary: #09090b;
      --text-secondary: #52525b;
      --text-muted: #a1a1aa;
      --ambient-glow: rgba(0, 0, 0, 0.08);
      --shadow-ambient: 0 28px 56px -12px rgba(0, 0, 0, 0.08), 0 1px 0 rgba(255, 255, 255, 0.9) inset;
      --bg-gradient: radial-gradient(circle at 50% 38%, rgba(0, 0, 0, 0.03) 0%, transparent 65%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-brand);
      overflow-x: hidden;
      padding: 2.5rem 1.5rem;
      position: relative;
      transition: var(--transition-theme);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--bg-gradient);
      pointer-events: none;
      z-index: 0;
      transition: var(--transition-theme);
    }

    /* Top utility bar */
    .header-bar {
      position: fixed;
      top: 1.75rem;
      right: 1.75rem;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .theme-toggle-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface-glass);
      border: 1px solid var(--surface-border);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .theme-toggle-btn:hover {
      background: var(--surface-hover);
      transform: scale(1.06);
    }

    .theme-toggle-btn:active {
      transform: scale(0.96);
    }

    .theme-toggle-btn svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-sun { display: none; }
    .icon-moon { display: block; }

    [data-theme="light"] .icon-sun { display: block; }
    [data-theme="light"] .icon-moon { display: none; }

    /* Showcase card */
    .showcase-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4.5rem 3rem;
      border-radius: 36px;
      background: var(--surface-glass);
      border: 1px solid var(--surface-border);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      box-shadow: var(--shadow-ambient);
      transition: var(--transition-theme);
    }

    .logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(320px, 80vw);
      aspect-ratio: 292 / 208;
    }

    /* Ambient atmospheric glow */
    .ambient-glow-layer {
      position: absolute;
      inset: -18%;
      background: radial-gradient(ellipse at center, var(--ambient-glow) 0%, transparent 70%);
      filter: blur(48px);
      opacity: 0.7;
      border-radius: 50%;
      pointer-events: none;
      animation: ambientBreathing 4.5s ease-in-out infinite alternate;
      z-index: 0;
      transition: background 0.4s ease;
    }

    @keyframes ambientBreathing {
      0% {
        opacity: 0.4;
        transform: scale(0.94);
      }
      100% {
        opacity: 0.9;
        transform: scale(1.08);
      }
    }

    .logo-svg {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    /* Path Animation Core */
    .logo-path {
      fill: transparent;
      stroke: var(--text-primary);
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: var(--path-length, 2400);
      stroke-dashoffset: var(--path-length, 2400);
      transition: stroke 0.4s ease;
    }

    .animating .logo-path {
      animation:
        drawStroke var(--duration) cubic-bezier(0.65, 0, 0.35, 1) forwards,
        fillIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) calc(var(--duration) - 0.5s) forwards;
    }

    /* Stroke-only mode */
    body.mode-stroke-only .animating .logo-path {
      animation: drawStroke var(--duration) cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    @keyframes drawStroke {
      0% {
        stroke-dashoffset: var(--path-length, 2400);
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fillIn {
      0% {
        fill: transparent;
      }
      100% {
        fill: var(--text-primary);
      }
    }

    /* Brand Typography with strictly -4.5px Letter-Spacing & Blur-In */
    .brand-title {
      position: relative;
      z-index: 1;
      font-family: var(--font-brand);
      font-size: clamp(3.2rem, 7.5vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -4.5px;
      line-height: 1;
      margin-top: 3rem;
      user-select: none;
      text-align: center;
      color: var(--text-primary);
      opacity: 0;
      filter: blur(16px);
      transform: translateY(14px);
      transition: color 0.4s ease;
    }

    .animating .brand-title {
      animation: smoothBlurReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) calc(var(--duration) - 0.75s) forwards;
    }

    @keyframes smoothBlurReveal {
      0% {
        opacity: 0;
        filter: blur(16px);
        transform: translateY(14px);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0);
      }
    }

    /* Minimalist Glass Control Dock */
    .control-dock {
      position: relative;
      z-index: 20;
      margin-top: 2.75rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.65rem 1.1rem;
      border-radius: 999px;
      background: var(--surface-glass);
      border: 1px solid var(--surface-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: var(--shadow-ambient);
      transition: var(--transition-theme);
    }

    .control-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 0.95rem;
      border-radius: 999px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-family: var(--font-brand);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .control-btn:hover {
      color: var(--text-primary);
      background: var(--surface-hover);
    }

    .control-btn.active {
      color: var(--text-primary);
      background: var(--surface-hover);
      border-color: var(--surface-border);
    }

    .control-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: var(--surface-border);
      margin: 0 0.15rem;
    }

    .keyboard-hint {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: -0.2px;
      text-align: center;
      user-select: none;
    }

    kbd {
      display: inline-block;
      padding: 0.15rem 0.4rem;
      font-size: 0.7rem;
      font-family: inherit;
      background: var(--surface-hover);
      border: 1px solid var(--surface-border);
      border-radius: 4px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body class="animating">
  <div class="header-bar">
    <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle color theme" title="Toggle theme (T)">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
  </div>

  <main class="showcase-container">
    <div class="logo-wrapper">
      <div class="ambient-glow-layer" aria-hidden="true"></div>
      <svg class="logo-svg" viewBox="0 0 292 208" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path id="animatedPath"
              class="logo-path"
              d="M0 0H212C249.5 0 280 30.5 280 67C280 94 266 112 245 131L230 146L292 208H226L164 146L101 208H0V129L81 47H0V0ZM147 47H212C224 47 233 56 233 68C233 75 229 82 223 88L164 146V80L82 162H34L147 47Z"
              fill-rule="evenodd"
              clip-rule="evenodd" />
      </svg>
    </div>
    <h1 class="brand-title">Zuris</h1>
  </main>

  <nav class="control-dock" aria-label="Animation controls">
    <button id="replayBtn" class="control-btn" title="Replay Animation (R or Space)">
      <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      <span>Replay</span>
    </button>
    <div class="divider"></div>
    <button id="modeToggle" class="control-btn" title="Toggle Stroke / Fill Mode">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 1 10 10v0a10 10 0 0 1-10 10"></path></svg>
      <span id="modeLabel">Fill + Stroke</span>
    </button>
    <div class="divider"></div>
    <button class="control-btn speed-btn" data-speed="1" title="1x Speed">1x</button>
    <button class="control-btn speed-btn" data-speed="1.5" title="1.5x Speed">1.5x</button>
    <button class="control-btn speed-btn" data-speed="2" title="2x Speed">2x</button>
  </nav>

  <p class="keyboard-hint">Press <kbd>Space</kbd> to replay &bull; <kbd>T</kbd> to toggle theme</p>

  <script>
    const root = document.documentElement;
    const body = document.body;
    const path = document.getElementById('animatedPath');
    const replayBtn = document.getElementById('replayBtn');
    const themeToggle = document.getElementById('themeToggle');
    const modeToggle = document.getElementById('modeToggle');
    const modeLabel = document.getElementById('modeLabel');
    const speedButtons = document.querySelectorAll('.speed-btn');

    // Compute dynamic path length
    if (path) {
      const length = Math.ceil(path.getTotalLength());
      root.style.setProperty('--path-length', length);
    }

    // Replay animation
    function restartAnimation() {
      body.classList.remove('animating');
      void body.offsetWidth; // Trigger DOM reflow
      body.classList.add('animating');
    }

    replayBtn.addEventListener('click', restartAnimation);

    // Theme switcher
    function toggleTheme() {
      const currentTheme = root.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', newTheme);
    }

    themeToggle.addEventListener('click', toggleTheme);

    // Mode toggle (Fill + Stroke vs Stroke Only)
    let strokeOnly = false;
    modeToggle.addEventListener('click', () => {
      strokeOnly = !strokeOnly;
      if (strokeOnly) {
        body.classList.add('mode-stroke-only');
        modeLabel.textContent = 'Stroke Only';
      } else {
        body.classList.remove('mode-stroke-only');
        modeLabel.textContent = 'Fill + Stroke';
      }
      restartAnimation();
    });

    // Speed controller
    speedButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        speedButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const speed = parseFloat(btn.getAttribute('data-speed'));
        const baseDuration = 3.2;
        const newDuration = (baseDuration / speed).toFixed(2) + 's';
        root.style.setProperty('--duration', newDuration);
        restartAnimation();
      });
    });

    // Default speed active state
    if (speedButtons.length > 0) speedButtons[0].classList.add('active');

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space' || e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        restartAnimation();
      } else if (e.key === 't' || e.key === 'T') {
        toggleTheme();
      }
    });
  </script>
</body>
</html>
